<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5EEDF">
<title>Admin Manager · CV Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EEDF;--cream2:#EADFC8;--ink:#16130F;--mut:#5d564b;--ok:#15693b;--warn:#a85507;--err:#b42318;
  --glass:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.42));
  --glass-card:rgba(255,255,255,.74);
  --glass-sub:rgba(255,255,255,.5);
  --glass-border:rgba(255,255,255,.92);
  --sh:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.045),0 18px 48px -18px rgba(70,50,15,.26),0 4px 14px -6px rgba(70,50,15,.12);
  --sh-sm:inset 0 1px 0 #fff,0 6px 18px -8px rgba(70,50,15,.16);
  --sh-lg:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.05),0 30px 80px -28px rgba(70,50,15,.32),0 10px 30px -12px rgba(70,50,15,.18);
  --ease:cubic-bezier(.22,1,.36,1);
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  --side-w:280px;
  --r-card:24px;
  --r-sub:18px;
  --r-item:16px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh;font:14px/1.55 Manrope,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.012em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}

/* ---------- Ambient background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#fffaf0,var(--cream))}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:fl 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:48vmax;height:48vmax;background:#E6D2A6;left:-14vmax;top:-12vmax}
.bg i:nth-child(2){width:38vmax;height:38vmax;background:#fff;right:-10vmax;top:20vh;animation-duration:25s}
.bg i:nth-child(3){width:32vmax;height:32vmax;background:#cdb88c;left:22vw;bottom:-14vmax;opacity:.5;animation-duration:29s}
@keyframes fl{to{transform:translate3d(7vmax,5vmax,0) scale(1.12)}}

/* ---------- Liquid glass primitives ---------- */
.glass,.sec-card,.sub-card,.arr-item,.login-card,.mob-bar,#mob-nav,#fab,#fm button{
  position:relative;
  background:var(--glass-card);
  backdrop-filter:blur(28px) saturate(1.85);
  -webkit-backdrop-filter:blur(28px) saturate(1.85);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh);
}
/* top sheen + diagonal gloss */
.sec-card::before,.sub-card::before,.arr-item::before,.login-card::before,#mob-nav::before,#fab::before{
  content:"";
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%),
    linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);
  opacity:.9;
}
.sec-card,.sub-card,.arr-item{overflow:hidden}
.sec-card>*,.sub-card>*,.arr-item>*{position:relative;z-index:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:99px;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.92);background:rgba(255,255,255,.82);color:var(--ink);box-shadow:var(--sh-sm);transition:transform .25s var(--ease),background .2s,box-shadow .25s;white-space:nowrap;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0) 50%);pointer-events:none}
.btn:hover{transform:translateY(-1px);background:#fff;box-shadow:0 10px 26px -12px rgba(70,50,15,.35)}
.btn:active{transform:scale(.96)}
.btn.k{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 26px -12px rgba(22,19,15,.65),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.k::after{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%)}
.btn.k:hover{background:#2a251e}
.btn.danger{color:var(--err);border-color:rgba(180,35,24,.22);background:rgba(255,245,245,.82)}
.btn:disabled{opacity:.42;pointer-events:none}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* =========================================================
   LOGIN
   ========================================================= */
#login-view{min-height:100dvh;display:none;place-items:center;padding:20px 16px}
#login-view.on{display:grid}
.login-card{width:100%;max-width:400px;padding:30px 24px;border-radius:28px;animation:rise .7s var(--ease);box-shadow:var(--sh-lg)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.login-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:16px;letter-spacing:.01em}
.login-badge i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,105,59,.15)}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card p{font-size:13.5px;color:var(--mut);margin-bottom:20px;line-height:1.55}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px;letter-spacing:.01em}
.fld input{width:100%;min-height:46px;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.72);font-size:14px;transition:border-color .2s,background .2s,box-shadow .2s}
.fld input:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(22,19,15,.08)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:8px;color:var(--mut);display:grid;place-items:center;border-radius:10px}
.pw-eye:hover{background:rgba(0,0,0,.05);color:var(--ink)}
#login-err{display:none;font-size:12.5px;font-weight:700;color:var(--err);background:rgba(180,35,24,.08);border:1px solid rgba(180,35,24,.22);padding:10px 13px;border-radius:13px;margin-bottom:14px;line-height:1.45}
.login-note{margin-top:16px;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.5}

/* =========================================================
   APP LAYOUT
   ========================================================= */
#app-view{display:none;min-height:100dvh}
#app-view.on{display:block}

/* ---------- Fixed sidebar ---------- */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--side-w);z-index:30;
  padding:18px 14px calc(18px + var(--sb));
  display:flex;flex-direction:column;gap:14px;
  border-right:1px solid rgba(255,255,255,.7);
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.34));
  backdrop-filter:blur(28px) saturate(1.8);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.6),8px 0 32px -20px rgba(70,50,15,.25);
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px}
.brand-ic{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:16px;flex:none;box-shadow:0 8px 20px -8px rgba(22,19,15,.6),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden}
.brand-ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.brand b{display:block;font-size:14.5px;line-height:1.25;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--mut);font-weight:700;letter-spacing:.01em}

.nav-list{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;padding:4px 2px 4px 0;scrollbar-width:thin}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;border-radius:14px;border:1px solid transparent;background:transparent;font-weight:700;font-size:13.5px;color:var(--mut);transition:all .22s var(--ease);position:relative}
.nav-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .22s var(--ease)}
.nav-item:hover{background:rgba(255,255,255,.62);color:var(--ink);border-color:rgba(255,255,255,.8)}
.nav-item:hover svg{transform:scale(1.06)}
.nav-item[aria-current=page]{background:var(--ink);color:#fff;box-shadow:0 10px 24px -10px rgba(22,19,15,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(22,19,15,.06);color:inherit;letter-spacing:.01em}
.nav-item[aria-current=page] .cnt{background:rgba(255,255,255,.22);color:#fff}

.side-foot{border-top:1px solid rgba(22,19,15,.08);padding-top:12px;display:grid;gap:8px}
.sync-pill{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);font-size:11.5px;font-weight:700;color:var(--mut)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(21,105,59,.15)}
.sync-dot.dirty{background:var(--warn);box-shadow:0 0 0 3px rgba(168,85,7,.18);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Workspace offset for fixed sidebar ---------- */
.workspace{margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column;min-height:100dvh}

.topbar{position:sticky;top:0;z-index:25;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(245,238,223,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(255,255,255,.6),0 8px 24px -20px rgba(70,50,15,.4)}
.top-title{display:flex;align-items:center;gap:10px;min-width:0}
.top-title h2{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-dirty{display:none;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(168,85,7,.12);color:var(--warn);border:1px solid rgba(168,85,7,.25);white-space:nowrap;letter-spacing:.01em}
.badge-dirty.on{display:inline-flex;align-items:center;gap:5px}
.badge-dirty.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);animation:pulse 1.6s infinite}
.top-actions{display:flex;align-items:center;gap:8px}

.mob-bar{display:none}
#mob-nav-wrap{display:none}

/* Editor canvas */
.editor-wrap{max-width:900px;width:100%;margin:0 auto;padding:22px 20px 96px}

/* =========================================================
   EDITOR CARD HIERARCHY
   ========================================================= */
.sec-card{border-radius:var(--r-card);padding:18px 18px 16px;margin-bottom:16px;animation:rise .42s var(--ease)}
.sec-card:hover{box-shadow:var(--sh-lg)}

.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(22,19,15,.07)}
.sec-head-left{display:flex;align-items:center;gap:10px;min-width:0}
.sec-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(22,19,15,.06);color:var(--ink);flex:none;border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff}
.sec-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sec-head-txt{min-width:0}
.sec-head h3{font-size:17px;font-weight:700;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-sub{font-size:11.5px;font-weight:600;color:var(--mut);margin-top:2px;letter-spacing:.005em}
.sec-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:rgba(22,19,15,.055);color:var(--mut);border:1px solid rgba(255,255,255,.85);white-space:nowrap;flex:none;letter-spacing:.01em}

/* Sub-section card: clear nested hierarchy */
.sub-card{border-radius:var(--r-sub);padding:14px;margin:12px 0;box-shadow:var(--sh-sm);background:var(--glass-sub)}
.sub-card .sec-head{margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid rgba(22,19,15,.055)}
.sub-card .sec-head h3{font-size:14.5px;font-weight:700}
.sub-card .sec-ic{width:28px;height:28px;border-radius:9px;background:rgba(22,19,15,.05)}
.sub-card .sec-ic svg{width:14px;height:14px}
.sub-card .sec-sub{display:none}

/* Array items */
.arr-item{border-radius:var(--r-item);padding:13px;margin:11px 0;background:rgba(255,255,255,.86);box-shadow:var(--sh-sm);transition:box-shadow .25s var(--ease),transform .2s var(--ease)}
.arr-item:hover{box-shadow:var(--sh)}
.arr-item-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid rgba(22,19,15,.06);min-width:0}
.arr-item.collapsed .arr-item-bar{margin-bottom:0;padding-bottom:0;border-bottom:0}
.arr-item.collapsed .arr-body{display:none}
.arr-title-grp{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.arr-idx{flex:none;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(180deg,#2a251e,var(--ink));padding:3px 9px;border-radius:99px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16);letter-spacing:.01em}
.arr-summary{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:-.005em}
.ctl-grp{display:flex;align-items:center;gap:5px;flex:none}
.ctl-btn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.92);background:rgba(255,255,255,.85);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:12.5px;transition:background .2s,transform .15s,color .2s;box-shadow:var(--sh-sm)}
.ctl-btn:hover{background:#fff;color:var(--ink)}
.ctl-btn:active{transform:scale(.9)}
.ctl-btn:disabled{opacity:.28;pointer-events:none}
.ctl-btn.del{color:var(--err);background:rgba(254,228,226,.78);border-color:rgba(180,35,24,.18)}
.ctl-btn.del:hover{background:#fee4e2}

/* Add button */
.add-btn{width:100%;margin-top:12px;min-height:44px;padding:11px;border-radius:14px;border:1.5px dashed rgba(22,19,15,.22);background:rgba(255,255,255,.5);font-weight:800;font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .22s var(--ease)}
.add-btn:hover{background:rgba(255,255,255,.85);border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--sh-sm)}
.add-btn:active{transform:scale(.985)}

/* Field */
.field-group{margin:12px 0}
.field-group:first-child{margin-top:2px}
.field-group:last-child{margin-bottom:0}
.field-group label{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--mut);margin-bottom:6px;letter-spacing:.015em;text-transform:uppercase}
.field-group input,.field-group textarea{width:100%;min-height:44px;padding:10px 13px;border-radius:13px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.78);color:var(--ink);font-weight:500;font-size:13.5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.025);transition:border-color .2s,background .2s,box-shadow .2s}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(22,19,15,.08)}
.field-group input::placeholder,.field-group textarea::placeholder{color:#a89f8f}
.field-group textarea{min-height:84px;resize:vertical;line-height:1.55}

.img-prev-wrap{display:flex;align-items:center;gap:11px;margin-top:8px;padding:9px;border-radius:13px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85)}
.th{width:52px;height:52px;object-fit:cover;border-radius:11px;background:var(--cream2);flex:none;border:1px solid rgba(255,255,255,.95);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.img-hint{font-size:11px;font-weight:700;color:var(--mut);line-height:1.4;word-break:break-word}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;visibility:hidden;transition:all .3s var(--ease);z-index:100;box-shadow:0 16px 40px rgba(0,0,0,.32);max-width:92vw;text-align:center;letter-spacing:.005em}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* Loader */
#loader{position:fixed;inset:0;z-index:90;background:var(--cream);display:grid;place-items:center;transition:opacity .4s,visibility .4s}
#loader.hide{opacity:0;visibility:hidden}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(22,19,15,.12);border-top-color:var(--ink);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* =========================================================
   MOBILE NATIVE APP MODE
   ========================================================= */
@media(max-width:860px){
  .sidebar{display:none}
  .workspace{margin-left:0}

  /* Topbar: native size + safe area */
  .topbar{padding:calc(10px + var(--st)) 16px 10px;border-bottom:0;background:rgba(245,238,223,.78)}
  .top-title h2{font-size:19px;font-weight:700}
  .top-actions .desk-only{display:none}
  .top-actions .btn{padding:9px 13px;font-size:13px;min-height:38px}

  /* Mobile action bar: bigger native tap targets */
  .mob-bar{display:flex;align-items:center;gap:7px;position:sticky;top:calc(56px + var(--st));z-index:24;padding:9px 16px 10px;background:rgba(245,238,223,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(255,255,255,.6)}
  .mob-bar .btn{flex:1;padding:10px 10px;font-size:13.5px;border-radius:13px;min-height:42px;font-weight:700}
  .mob-bar .btn.icon-btn{flex:none;width:44px;min-height:42px;padding:0}

  /* Editor spacing: native comfy */
  .editor-wrap{padding:14px 14px calc(120px + var(--sb))}
  .sec-card{padding:16px 15px;border-radius:22px;margin-bottom:14px}
  .sec-head{margin-bottom:13px;padding-bottom:11px}
  .sec-head h3{font-size:17.5px}
  .sec-sub{font-size:12px}
  .sec-ic{width:36px;height:36px;border-radius:12px}
  .sec-ic svg{width:18px;height:18px}
  .sub-card{padding:13px;border-radius:16px}
  .arr-item{padding:12px;border-radius:15px}
  .arr-summary{font-size:13.5px}
  .ctl-btn{width:36px;height:36px;border-radius:11px;font-size:13px}

  /* Inputs: 16px prevents iOS zoom, comfy tap */
  .field-group{margin:13px 0}
  .field-group label{font-size:12px;margin-bottom:7px}
  .field-group input,.field-group textarea{font-size:16px;padding:12px 14px;border-radius:14px;min-height:50px}
  .field-group textarea{min-height:96px}
  .add-btn{min-height:50px;font-size:14px;border-radius:15px;margin-top:14px}
  .img-prev-wrap{padding:10px;gap:12px;border-radius:14px}
  .th{width:58px;height:58px;border-radius:12px}
  .img-hint{font-size:11.5px}

  /* Bottom nav: native proportions */
  #mob-nav-wrap{display:block}
  #mob-nav{position:fixed;z-index:50;left:12px;right:80px;bottom:calc(12px + var(--sb));height:62px;border-radius:31px;padding:6px;display:flex;gap:3px;background:var(--glass);box-shadow:var(--sh-lg)}
  #mob-nav button{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:10.5px;border-radius:24px;color:var(--mut);min-width:0;transition:background .3s var(--ease),color .3s,transform .15s}
  #mob-nav button.ov{display:none}
  #mob-nav button:active{transform:scale(.92)}
  #mob-nav button[aria-current=page]{background:var(--ink);color:#fff;box-shadow:0 6px 18px -6px rgba(22,19,15,.6),inset 0 1px 0 rgba(255,255,255,.14)}
  #mob-nav svg,#fm svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

<script>
/* ==========================================================================

const JSONBIN_URL = "https://api.jsonbin.io/v3/b/6af5bb36ffd5d16053bc10cf";

/* ==========================================================================
   2. KONSTANTA & HELPERS

const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k] || ICONS.site}"/></svg>`;

let D = null;
let tab = "site";
let dirty = false;
let MORE_TABS = [];

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2600);
}

function setDirty(v) {
  dirty = !!v;
  $("#dirty-badge").classList.toggle("on", dirty);
  $("#sync-dot").classList.toggle("dirty", dirty);
  $("#sync-text").textContent = dirty ? "Ada perubahan lokal" : "Tersinkronisasi";
}

/* ==========================================================================
   3. KONEKSI JSONBIN (GET & PUT)
   ========================================================================== */
async function fetchFromJSONBin() {
  const res = await fetch(JSONBIN_URL, {
    method: "GET",
    headers: {
      Accept: "application/json",
      "X-Master-Key": JSONBIN_KEY,
      "X-Access-Key": JSONBIN_KEY
    },
    cache: "no-store"
  });
  if (!res.ok) throw new Error("Gagal memuat dari JSONBin (" + res.status + ")");
  const json = await res.json();
  return json.record ?? json;
}

async function saveToJSONBin() {
  if (!D) return;
  const btns = [$("#save-desk"), $("#save-mob")];
  btns.forEach((b) => {
    if (b) {
      b.disabled = true;
      b.dataset.old = b.textContent;
      b.textContent = "Menyimpan...";
    }
  });
  try {
    const res = await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_KEY,
        "X-Access-Key": JSONBIN_KEY
      },
      body: JSON.stringify(D)
    });
    if (!res.ok) {
      const errTxt = await res.text().catch(() => "");
      throw new Error("HTTP " + res.status + (errTxt ? " — Pastikan JSONBIN_KEY memiliki izin Write" : ""));
    }
    setDirty(false);
    if (D.admin && getSession()) saveSession(D.admin.username);
    toast("Berhasil disimpan langsung ke JSONBin!");
  } catch (err) {
    toast("Gagal menyimpan ke Cloud: " + err.message);
  } finally {
    btns.forEach((b) => {
      if (b) {
        b.disabled = false;
        b.textContent = b.dataset.old || "Simpan Cloud";
      }
    });
  }
}

/* ==========================================================================
   4. SISTEM LOGIN & SESI 30 HARI
   ========================================================================== */
function getSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.expiresAt || Date.now() > s.expiresAt) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s;
  } catch {
    return null;
  }
}

function saveSession(username) {
  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify({
      username,
      loggedInAt: Date.now(),
      expiresAt: Date.now() + SESSION_MS
    })
  );
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

$("#pw-toggle").onclick = () => {
  const inp = $("#p-in");
  inp.type = inp.type === "password" ? "text" : "password";
};

$("#login-form").onsubmit = async (e) => {
  e.preventDefault();
  const u = $("#u-in").value.trim();
  const p = $("#p-in").value;
  const errEl = $("#login-err");
  const btn = $("#login-btn");

  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Memverifikasi...";

  try {
    const latest = await fetchFromJSONBin();
    if (!latest.admin) latest.admin = { username: "admin", password: "123456" };

    if (u === String(latest.admin.username) && p === String(latest.admin.password)) {
      saveSession(u);
      D = latest;
      showWorkspace();
      toast("Selamat datang kembali, " + u + "!");
    } else {
      errEl.textContent = "Username atau password tidak sesuai dengan data di database.";
      errEl.style.display = "block";
    }
  } catch (err) {
    errEl.textContent = "Gagal terhubung ke JSONBin: " + err.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Masuk ke Dashboard";
  }
};

function handleLogout() {
  if (dirty && !confirm("Ada perubahan yang belum disimpan ke Cloud. Tetap keluar?")) return;
  clearSession();
  setDirty(false);
  toggleFab(false);
  $("#app-view").classList.remove("on");
  $("#login-view").classList.add("on");
  $("#p-in").value = "";
}
$("#logout-desk").onclick = handleLogout;
$("#logout-mob").onclick = handleLogout;

/* ==========================================================================
   5. FAB MENU & NAVIGASI HISTORY.PUSHSTATE()
   ========================================================================== */
const fabWrap = $("#fabw");
const fabBtn = $("#fab");

function toggleFab(open) {
  const next = typeof open === "boolean" ? open : !fabWrap.classList.contains("open");
  fabWrap.classList.toggle("open", next);
  fabBtn.setAttribute("aria-expanded", String(next));
}

fabBtn.onclick = () => toggleFab();
$("#sc").onclick = () => toggleFab(false);
addEventListener("keydown", (e) => e.key === "Escape" && toggleFab(false));

function getTabKeys() {
  if (!D) return [];
  const rawKeys = Object.keys(D);
  const ordered = TAB_ORDER.filter((k) => rawKeys.includes(k));
  const extra = rawKeys.filter((k) => !ordered.includes(k));
  return [...ordered, ...extra];
}

function urlForTab(t) {
  const base = location.pathname + location.search;
  return t === "site" ? base : base + "#" + t;
}

function switchTab(nextTab, noHistory = false) {
  const keys = getTabKeys();
  if (!keys.length) return;
  const target = keys.includes(nextTab) ? nextTab : keys[0];

  if (!noHistory && target !== tab) {
    try {
      history.pushState({ tab: target }, "", urlForTab(target));
    } catch {
      location.hash = target === "site" ? "" : target;
    }
  }

  tab = target;
  toggleFab(false);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

window.addEventListener("popstate", (e) => {
  if (!D) return;
  const st = e.state && e.state.tab;
  const h = location.hash.slice(1);
  const keys = getTabKeys();
  if (st && keys.includes(st)) switchTab(st, true);
  else if (!location.hash) switchTab(keys[0], true);
  else if (keys.includes(h)) switchTab(h, true);
});

window.addEventListener("hashchange", () => {
  if (!D) return;
  const h = location.hash.slice(1);
  const keys = getTabKeys();
  if (!h && tab !== keys[0]) switchTab(keys[0], true);
  else if (keys.includes(h) && h !== tab) switchTab(h, true);
});

/* ==========================================================================
   6. RECURSIVE CRUD FORM BUILDER
   ========================================================================== */
const blank = (v) =>
  Array.isArray(v)
    ? []
    : v && typeof v === "object"
    ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, blank(x)]))
    : typeof v === "number"
    ? 0
    : "";

const sp = (p) => p.filter((x) => isNaN(x)).join(".");
const isImgKey = (k, path) => /^(src|main)$/.test(k) || sp(path) === "photos.slides";

function countItems(val) {
  if (Array.isArray(val)) return val.length;
  if (val && typeof val === "object") return Object.keys(val).length;
  return "";
}

function getItemSummary(item, index) {
  if (typeof item === "string") return item.trim() || `Item #${index + 1}`;
  if (item && typeof item === "object") {
    return (
      item.title ||
      item.group ||
      item.school ||
      item.name ||
      item.label ||
      item.caption ||
      (item.src ? "Foto #" + (index + 1) : `Entri #${index + 1}`)
    );
  }
  return `Item #${index + 1}`;
}

/* Helper: render header sekunder yang konsisten (ikon + judul + desc + pill) */
function secHeadHtml({ title, desc, count, icon, pillClass = "sec-pill" }) {
  const ic = icon ? `<span class="sec-ic">${svg(icon)}</span>` : "";
  const sub = desc ? `<div class="sec-sub">${esc(desc)}</div>` : "";
  const pill = count !== "" && count !== undefined ? `<span class="${pillClass}">${esc(String(count))}</span>` : "";
  return `<div class="sec-head">
    <div class="sec-head-left">${ic}<div class="sec-head-txt"><h3>${esc(title)}</h3>${sub}</div></div>
    ${pill}
  </div>`;
}

function renderField(obj, k, path, customLabel) {
  const val = obj[k];
  const p = [...path, k];
  const labelText = customLabel || FIELD_LABEL[k] || LABEL[k] || k;

  if (Array.isArray(val)) {
    return renderList(val, p, labelText);
  }

  if (val && typeof val === "object") {
    const inner = Object.keys(val)
      .map((childKey) => renderField(val, childKey, p))
      .join("");
    if (path.length === 0) {
      const topKey = String(k);
      return `<div class="sec-card">${secHeadHtml({
        title: labelText,
        desc: TAB_DESC[topKey] || "",
        count: `${Object.keys(val).length} bidang`,
        icon: topKey
      })}${inner}</div>`;
    }
    return `<div class="sub-card">${secHeadHtml({ title: labelText, count: `${Object.keys(val).length} bidang` })}${inner}</div>`;
  }

  const id = "f" + Math.random().toString(36).slice(2, 9);
  const isLong = String(val).length > 60 || /note|summary|caption|address/.test(String(k));
  const isNum = typeof val === "number";
  const showImg = isImgKey(String(k), p);

  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = () => {
      obj[k] = isNum ? Number(el.value) : el.value;
      setDirty(true);
      const prev = el.parentNode.querySelector(".th");
      if (prev) prev.src = el.value;
      const itemCard = el.closest(".arr-item");
      if (itemCard) {
        const sumEl = itemCard.querySelector(":scope > .arr-item-bar .arr-summary");
        const arrIdx = Number(itemCard.dataset.i);
        if (sumEl && !isNaN(arrIdx)) {
          sumEl.textContent = typeof obj === "object" && !Array.isArray(obj) ? getItemSummary(obj, arrIdx) : el.value || `Item #${arrIdx + 1}`;
        }
      }
    };
  });

  return `
    <div class="field-group">
      <label for="${id}">${esc(labelText)}</label>
      ${
        isLong
          ? `<textarea id="${id}" placeholder="Ketik ${esc(labelText.toLowerCase())}...">${esc(val)}</textarea>`
          : `<input id="${id}" value="${esc(val)}" placeholder="Isi ${esc(labelText.toLowerCase())}..." ${isNum ? 'type="number"' : 'type="text"'}>`
      }
      ${
        showImg
          ? `<div class="img-prev-wrap"><img class="th" src="${esc(val)}" alt="Pratinjau" referrerpolicy="no-referrer" onerror="this.style.opacity='.25'"><span class="img-hint">Pratinjau gambar dari URL</span></div>`
          : ""
      }
    </div>`;
}

function renderList(arr, path, labelText) {
  const id = "l" + Math.random().toString(36).slice(2, 9);

  setTimeout(() => {
    const root = document.getElementById(id);
    if (!root) return;

    root.querySelectorAll(":scope > .arr-item").forEach((itemEl) => {
      const idx = Number(itemEl.dataset.i);
      itemEl.querySelectorAll(":scope > .arr-item-bar .ctl-btn").forEach((btn) => {
        btn.onclick = () => {
          const act = btn.dataset.a;
          if (act === "fold") {
            itemEl.classList.toggle("collapsed");
            btn.textContent = itemEl.classList.contains("collapsed") ? "+" : "−";
            return;
          }
          if (act === "del") {
            arr.splice(idx, 1);
          } else {
            const swapIdx = idx + (act === "up" ? -1 : 1);
            if (swapIdx < 0 || swapIdx >= arr.length) return;
            [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
          }
          setDirty(true);
          render();
        };
      });
    });

    const addBtn = root.querySelector(":scope > .add-btn");
    if (addBtn) {
      addBtn.onclick = () => {
        const schemaKey = sp(path);
        const tpl = arr.length ? blank(arr[0]) : clone(TPL[schemaKey] ?? "");
        arr.push(tpl);
        setDirty(true);
        render();
      };
    }
  });

  const itemsHtml = arr
    .map((item, i) => {
      const isObj = item && typeof item === "object";
      const summary = getItemSummary(item, i);
      const inner = isObj
        ? Object.keys(item)
            .map((k) => renderField(item, k, [...path, i]))
            .join("")
        : renderField(arr, i, path, `Isi #${i + 1}`);

      return `
        <div class="arr-item" data-i="${i}">
          <div class="arr-item-bar">
            <div class="arr-title-grp">
              <span class="arr-idx">#${i + 1}</span>
              <span class="arr-summary">${esc(summary)}</span>
            </div>
            <div class="ctl-grp">
              <button type="button" class="ctl-btn" data-a="up" aria-label="Naik" title="Naik" ${i === 0 ? "disabled" : ""}>↑</button>
              <button type="button" class="ctl-btn" data-a="dn" aria-label="Turun" title="Turun" ${i === arr.length - 1 ? "disabled" : ""}>↓</button>
              ${isObj ? `<button type="button" class="ctl-btn" data-a="fold" aria-label="Lipat" title="Lipat/Buka">−</button>` : ""}
              <button type="button" class="ctl-btn del" data-a="del" aria-label="Hapus" title="Hapus">✕</button>
            </div>
          </div>
          <div class="arr-body">${inner}</div>
        </div>`;
    })
    .join("");

  const wrapClass = path.length === 1 ? "sec-card" : "sub-card";
  const desc = path.length === 1 ? "Kelola daftar item di bagian ini" : "";
  const headIcon = path.length === 1 ? sp(path) : null;
  return `
    <div class="${wrapClass}" id="${id}">
      ${secHeadHtml({ title: labelText, desc, count: `${arr.length} item`, icon: headIcon })}
      ${itemsHtml}
      <button type="button" class="add-btn">+ Tambah ${esc(labelText)}</button>
    </div>`;
}

function render() {
  if (!D) return;
  const keys = getTabKeys();

  $("#desk-nav").innerHTML = keys
    .map((k) => {
      const c = countItems(D[k]);
      return `<button type="button" class="nav-item" data-t="${esc(k)}" aria-current="${k === tab ? "page" : "false"}">
        ${svg(k)}<span>${esc(LABEL[k] || k)}</span>${c !== "" ? `<span class="cnt">${c}</span>` : ""}
      </button>`;
    })
    .join("");

  $("#mob-nav").innerHTML = keys
    .map(
      (k, i) => `<button type="button" data-t="${esc(k)}" class="${i > 2 ? "ov" : ""}" aria-current="${k === tab ? "page" : "false"}">
        ${svg(k)}<span>${esc(SHORT_LABEL[k] || LABEL[k] || k)}</span>
      </button>`
    )
    .join("");

  const moreKeys = keys.slice(3);
  MORE_TABS = moreKeys;
  $("#fm").innerHTML = moreKeys
    .map((k, i) => {
      const c = countItems(D[k]);
      return `<button type="button" role="menuitem" data-t="${esc(k)}" style="--i:${i};--n:${moreKeys.length}" aria-current="${k === tab ? "page" : "false"}">
        ${svg(k)}<span>${esc(LABEL[k] || k)}</span>${c !== "" ? `<span class="fcnt">${c}</span>` : ""}
      </button>`;
    })
    .join("");

  if (MORE_TABS.includes(tab)) fabBtn.setAttribute("data-act", "");
  else fabBtn.removeAttribute("data-act");

  $$("[data-t]").forEach((btn) => {
    btn.onclick = () => switchTab(btn.dataset.t);
  });

  $("#page-heading").textContent = LABEL[tab] || tab;
  if (D.site?.name) $("#brand-name").textContent = D.site.name;

  const holder = { [tab]: D[tab] };
  $("#ed").innerHTML = renderField(holder, tab, [], LABEL[tab] || tab);
}

/* ==========================================================================
   7. AKSI DOWNLOAD, PRATINJAU & MUAT FILE LOKAL
   ========================================================================== */
function downloadJSON() {
  if (!D) return;
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "database.json";
  a.click();
  toast("File database.json berhasil diunduh.");
}

function openPreview() {
  if (!D) return;
  try {
    localStorage.setItem("cv_db_preview", JSON.stringify(D));
    window.open("index.html?preview=1", "_blank");
  } catch {
    toast("Pratinjau tidak tersedia di browser ini.");
  }
}

function handleFileLoad(e) {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then((txt) => {
    try {
      const parsed = JSON.parse(txt);
      if (!parsed.admin && D?.admin) parsed.admin = clone(D.admin);
      D = parsed;
      setDirty(true);
      render();
      toast("File JSON dimuat. Klik Simpan Cloud untuk memperbarui JSONBin.");
    } catch {
      toast("Format file JSON tidak valid.");
    }
  });
}

$("#dl-desk").onclick = downloadJSON;
$("#dl-mob").onclick = downloadJSON;
$("#pv-desk").onclick = openPreview;
$("#pv-mob").onclick = openPreview;
$("#save-desk").onclick = saveToJSONBin;
$("#save-mob").onclick = saveToJSONBin;
$("#fl-desk").onchange = handleFileLoad;
$("#fl-mob").onchange = handleFileLoad;

addEventListener("beforeunload", (e) => {
  if (dirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

/* ==========================================================================
   8. INISIALISASI APLIKASI
   ========================================================================== */
function showWorkspace() {
  $("#login-view").classList.remove("on");
  $("#app-view").classList.add("on");

  const keys = getTabKeys();
  const rawHash = location.hash.slice(1);
  const initialTab = keys.includes(rawHash) ? rawHash : keys[0];

  try {
    history.replaceState({ tab: initialTab }, "", urlForTab(initialTab));
  } catch {}

  tab = initialTab;
  render();
}

async function boot() {
  const session = getSession();
  if (session) {
    try {
      const data = await fetchFromJSONBin();
      if (!data.admin) data.admin = { username: "admin", password: "123456" };
      D = data;
      showWorkspace();
    } catch {
      try {
        const localRes = await fetch("database.json", { cache: "no-cache" });
        D = await localRes.json();
        if (!D.admin) D.admin = { username: "admin", password: "123456" };
        showWorkspace();
        toast("Mode offline: memuat dari database.json lokal.");
      } catch {
        clearSession();
        $("#login-view").classList.add("on");
      }
    }
  } else {
    $("#login-view").classList.add("on");
  }
  $("#loader").classList.add("hide");
}

boot();
</script>
